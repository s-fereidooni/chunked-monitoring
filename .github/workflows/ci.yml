name: ci

# Lint and unit tests only. The pipeline audit (`scripts/audit_pipeline.py`) is
# deliberately not run here: it needs the gated MALT dataset and a token, and
# would fail on every fork. Run it locally before trusting a results directory —
# see docs/handoff.md for why the test suite alone is not enough.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
