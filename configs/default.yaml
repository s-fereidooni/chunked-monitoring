# Baseline experiment config. Copy and override for variants.
#
# Stage 1-3 (global monitor) ignore the `chunk` and `aggregation` blocks;
# Stage 4-5 (chunk monitor) use all of them.

name: baseline
description: >
  Global vs. chunk-wise monitoring on a 500-run manually-reviewed MALT subset.

prompt_version: v1
output_dir: results

dataset:
  hf_repo: metr-evals/malt-public
  hf_config: default
  split: public

subset:
  n_samples: 500
  seed: 0
  manually_reviewed_only: true
  # ~92% of MALT's reviewed positives are `prompted`; stratify so the subset
  # isn't dominated by a single model's prompted behavior.
  stratify_by: [is_positive, run_source]
  positive_fraction: 0.5
  max_prompted_fraction: 0.5
  max_characters: null

model:
  provider: openai
  name: gpt-4.1-mini
  # The monitor produces a short structured verdict, not a long explanation.
  max_tokens: 256
  # Deterministic judgments make global-vs-chunk comparisons reproducible.
  temperature: 0.0
  max_concurrency: 8
  max_retries: 4

chunk:
  size: 10
  overlap: 0
  unit: messages
  # METR's MALT baseline repeats the first five messages across all chunks so
  # each one can see the task description.
  context_messages: 5

aggregation:
  method: max
  top_k: 3
