# Baseline experiment config. Copy and override for variants.
#
# Stage 1-3 (global monitor) ignore the `chunk` and `aggregation` blocks;
# Stage 4-5 (chunk monitor) use all of them.

name: baseline
description: >
  Global vs. chunk-wise monitoring on a 500-run manually-reviewed MALT subset.

prompt_version: v1
output_dir: results

dataset:
  hf_repo: metr-evals/malt-public
  hf_config: default
  split: public

subset:
  n_samples: 500
  seed: 0
  manually_reviewed_only: true
  # ~92% of MALT's reviewed positives are `prompted`; stratify so the subset
  # isn't dominated by a single model's prompted behavior.
  stratify_by: [is_positive, run_source]
  positive_fraction: 0.5
  max_prompted_fraction: 0.5
  max_characters: null

model:
  name: claude-opus-5
  max_tokens: 4096
  effort: high
  thinking: adaptive
  # Left unset: current Claude models reject `temperature` with a 400.
  temperature: null
  max_concurrency: 8
  max_retries: 4

chunk:
  size: 10
  overlap: 0
  unit: messages

aggregation:
  method: max
  top_k: 3
