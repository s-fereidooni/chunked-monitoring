# Baseline experiment: sandbagging detection, global monitor.
#
# Scope note: reward hacking is deliberately out of scope for this run. Its 62
# reviewed runs average 469k tokens (17x benign), 37% exceed the per-request
# limit, and in pilot testing gpt-4.1-mini detected 0 of 12. Sandbagging has six
# labels and 1,073 available runs, so per-label conclusions are reachable there.
# Chunking is also deferred — this run establishes the global baseline first.

name: sandbagging-global
description: >
  Global monitor for sandbagging on MALT, 50 runs per behavior label plus benign
  controls, using METR's sandbagging monitor prompt.

monitor_target: sandbagging
prompt_version: v3
output_dir: results

dataset:
  hf_repo: metr-evals/malt-public
  hf_config: default
  split: public

subset:
  # Per-label quotas: the six sandbagging labels differ enough in character that
  # a family average would mostly track whichever label is largest (refusals,
  # at 324). gives_up has only 17 runs in the whole reviewed pool, so it is
  # reported descriptively rather than tested.
  label_quotas:
    sabotage: 50
    refusals: 50
    partial_problem_solving: 50
    match_weaker_model: 50
    reasoning_about_task: 50
    gives_up: all
    benign: 296

  seed: 0
  manually_reviewed_only: true
  # Excludes runs the global monitor cannot send in one request (400k TPM cap).
  max_transcript_tokens: 350000

model:
  provider: openai
  name: gpt-4.1-mini
  max_tokens: 256
  temperature: 0.0
  # Kept below the 400k TPM ceiling so concurrent requests do not thrash on 429s.
  max_concurrency: 2
  max_retries: 8
  max_input_tokens: 350000

# Unused by the global stage; retained for the chunked follow-up.
chunk:
  size: 10
  overlap: 0
  unit: messages
  context_messages: 5

aggregation:
  method: max
  top_k: 3
